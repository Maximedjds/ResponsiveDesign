name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Basic checks (Files exist & Syntax)
      run: |
        python -m compileall app.py
        python -c "from pathlib import Path; assert Path('index.html').exists(), 'index.html missing'; assert Path('style.css').exists(), 'style.css missing'"
        echo "✅ Tous les fichiers critiques sont présents et valides."